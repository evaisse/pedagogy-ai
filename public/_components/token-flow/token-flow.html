<section class="token-flow" part="surface">
  <header class="token-flow-header">
    <p class="token-flow-kicker" data-kicker></p>
    <h2 class="token-flow-title" data-title></h2>
    <p class="token-flow-summary" data-summary></p>
  </header>

  <div class="token-flow-track" role="list" aria-label="Token flow" data-token-list></div>

  <footer class="token-flow-legend" aria-label="Token states">
    <span><i class="legend-dot cached"></i>Cached</span>
    <span><i class="legend-dot write"></i>Written</span>
    <span><i class="legend-dot fresh"></i>Fresh</span>
    <span><i class="legend-dot miss"></i>Miss</span>
  </footer>
</section>
